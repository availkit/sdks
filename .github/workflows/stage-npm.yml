name: Stage npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact @availkit/client version to stage
        required: true
      dist_tag:
        description: Stable releases use latest; prereleases use next
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: npm-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.15.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Check requested version and tag
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          version=$(node -p "require('./packages/typescript/package.json').version")
          test "$version" = "$EXPECTED_VERSION"
          if [[ "$version" == *-* ]]; then test "$DIST_TAG" = next; else test "$DIST_TAG" = latest; fi
      - run: bun run generate:check
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:node
      - run: bun run test:bun
      - run: bun run test:browser
      - run: bun run test:package
      - name: Pack
        id: pack
        working-directory: packages/typescript
        run: |
          npm pack --json > pack.json
          echo "file=$(node -p "require('./pack.json')[0].filename")" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: packages/typescript/${{ steps.pack.outputs.file }}
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ inputs.version }}
          path: packages/typescript/${{ steps.pack.outputs.file }}
          if-no-files-found: error
      - name: Submit to npm staging
        working-directory: packages/typescript
        run: npm stage publish --access public --tag "${{ inputs.dist_tag }}"
