name: Stage npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact @availkit/client version to stage
        required: true
        default: 0.1.0

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: npm-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Check requested version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: test "$(node -p "require('./packages/typescript/package.json').version")" = "$EXPECTED_VERSION"
      - run: bun run generate:check
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:node
      - run: bun run test:bun
      - run: bun run test:browser
      - run: bun run test:package
      - name: Pack
        id: pack
        working-directory: packages/typescript
        run: |
          npm pack --json > pack.json
          echo "file=$(node -p "require('./pack.json')[0].filename")" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: packages/typescript/${{ steps.pack.outputs.file }}
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ inputs.version }}
          path: packages/typescript/${{ steps.pack.outputs.file }}
          if-no-files-found: error
